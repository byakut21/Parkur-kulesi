name: Web sürümü

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.3"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Godot önbelleği
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-web

      - name: Godot ve web şablonlarını indir
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -e
          V=${GODOT_VERSION}
          mkdir -p ~/godot ~/.local/share/godot/export_templates/${V}.stable
          cd ~/godot
          wget -q https://github.com/godotengine/godot/releases/download/${V}-stable/Godot_v${V}-stable_linux.x86_64.zip
          unzip -q Godot_v${V}-stable_linux.x86_64.zip
          mv Godot_v${V}-stable_linux.x86_64 godot
          rm Godot_v${V}-stable_linux.x86_64.zip
          wget -q https://github.com/godotengine/godot/releases/download/${V}-stable/Godot_v${V}-stable_export_templates.tpz
          unzip -q Godot_v${V}-stable_export_templates.tpz 'templates/web*' 'templates/version.txt'
          mv templates/* ~/.local/share/godot/export_templates/${V}.stable/
          rm -rf templates Godot_v${V}-stable_export_templates.tpz

      - name: Projeyi içe aktar
        run: ~/godot/godot --headless --editor --quit || true

      - name: Mekanik testleri
        run: ~/godot/godot --headless -s res://tests/mechanics_test.gd

      - name: Web export
        run: |
          mkdir -p build/web
          ~/godot/godot --headless --export-release "Web" build/web/index.html
          test -f build/web/index.wasm

      - name: İndirilebilir yapı
        uses: actions/upload-artifact@v4
        with:
          name: parkur-kulesi-web
          path: build/web

      - name: Pages yapısı
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
